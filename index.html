<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="container">
    <div class="inside-container">
      <h1>Temperature Converter 🌡️❄️☀️</h1>

      <select name="temperatures" id="temperatureFrom" required class="from-class" onchange="calculate()">
        <option value="" disabled selected hidden>From Temperature</option>
        <option value="celsius">Celsius</option>
        <option value="fahrenheit">Fahrenheit</option>
        <option value="kelvin">Kelvin</option>
      </select>
      <span class="arrow">
        ⬇
      </span>


      <select name="temperatures" id="temperatureTo" required class="to-class" onchange="calculate()">
        <option value="" disabled selected hidden>To Temperature</option>
        <option value="celsius">Celsius</option>
        <option value="fahrenheit">Fahrenheit</option>
        <option value="kelvin">Kelvin</option>

      </select>


      <input class="given-temp" placeholder="Enter the Temperature here" oninput="calculate();">
      <p class="show-temp"></p>
    </div>


  </div>

  <script src="temp.js">

    

  </script>

</body>

</html>
